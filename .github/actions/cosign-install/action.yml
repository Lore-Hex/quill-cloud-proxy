name: cosign-install
description: >-
  Install a pinned cosign release binary from sigstore/cosign's GitHub release,
  verified against a SHA-256 checksum recorded here (from the release's
  cosign_checksums.txt). Replaces sigstore/cosign-installer, which verified the
  requested release with a bootstrap cosign; the pinned checksum fixes the exact
  bytes instead. Keep cosign-release on a release patched for
  GHSA-fx35-mq7g-6g98 (2.6.5+ on 2.x, 3.1.3+ on 3.x);
  tools/test_check_trust_signatures.py enforces it.
inputs:
  cosign-release:
    description: cosign release tag, v<major>.<minor>.<patch>. It must have a checksum below.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        COSIGN_RELEASE: ${{ inputs.cosign-release }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64) arch=arm64 ;;
          *) echo "::error::cosign-install: unsupported architecture $(uname -m)"; exit 1 ;;
        esac
        case "$COSIGN_RELEASE/$arch" in
          v2.6.5/amd64) sha256=c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644 ;;
          v2.6.5/arm64) sha256=426193b4c5da4d4d643e822f48fe0cc8a476ca1782a272704831f5a0cef716d7 ;;
          *) echo "::error::cosign-install: no pinned checksum for cosign ${COSIGN_RELEASE} on ${arch}; add one to this action"; exit 1 ;;
        esac
        dest="${HOME}/.cosign"
        mkdir -p "$dest"
        curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 -o "${dest}/cosign.download" \
          "https://github.com/sigstore/cosign/releases/download/${COSIGN_RELEASE}/cosign-linux-${arch}"
        echo "${sha256}  ${dest}/cosign.download" | sha256sum --check --strict -
        chmod 0755 "${dest}/cosign.download"
        mv -f "${dest}/cosign.download" "${dest}/cosign"
        "${dest}/cosign" version
        "${dest}/cosign" version 2>&1 | grep -Eq "GitVersion: +${COSIGN_RELEASE}\$" \
          || { echo "::error::cosign-install: installed cosign is not ${COSIGN_RELEASE}"; exit 1; }
        echo "$dest" >> "$GITHUB_PATH"
