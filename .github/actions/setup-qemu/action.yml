name: setup-qemu
description: >-
  Register QEMU user-mode emulators with binfmt_misc, as
  docker/setup-qemu-action@v3 did: run the tonistiigi/binfmt image (now pinned
  by digest) with --install for the requested platforms.
inputs:
  platforms:
    description: Comma-separated platforms, e.g. arm64.
    default: all
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PLATFORMS: ${{ inputs.platforms }}
        # docker.io/tonistiigi/binfmt:latest on 2026-11-13.
        IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      run: |
        set -euo pipefail
        [[ "$PLATFORMS" =~ ^[a-z0-9,/._-]+$ ]] || { echo "::error::setup-qemu: invalid platforms"; exit 1; }
        docker run --rm --privileged "$IMAGE" --install "$PLATFORMS"
        docker run --rm --privileged "$IMAGE"
