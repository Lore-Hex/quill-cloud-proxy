name: Publish trust page

on:
  workflow_call:
    inputs:
      expected_digests:
        description: "Exact comma-separated digest set expected after publication"
        required: false
        type: string
      expected_references:
        description: "Exact comma-separated image-reference set expected after publication"
        required: false
        type: string
      artifact_name:
        description: "Unique Pages artifact name within the calling workflow run"
        required: false
        default: "github-pages"
        type: string
  push:
    branches: [main]
    paths:
      - "trust-page/**"
      - ".github/workflows/publish-trust-page.yml"
  # Backstop: the deploy workflow commits trust artifacts with GITHUB_TOKEN,
  # and GITHUB_TOKEN pushes never trigger push workflows — so a failed
  # in-run Pages publish used to leave trust.trustedrouter.com serving a
  # stale digest with nothing re-firing it (observed 2026-07-04, run
  # 28720340595). workflow_run fires on deploy completion regardless of the
  # deploy run's conclusion, so the page always gets (re)published from
  # main's current artifacts.
  workflow_run:
    workflows: ["Deploy GCP enclave (attested workload)"]
    types: [completed]
  workflow_dispatch: {}

# Serialize with the deploy workflow's publish-trust-page job (same group
# name there). Concurrent Pages deployments conflict; queueing them is the
# root-cause fix. Publishes are idempotent, so an extra queued run is
# harmless.
concurrency:
  group: trust-pages-deployment
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the triggering run's head by default;
          # always publish main's current artifacts instead.
          ref: main
      - name: Validate static trust page
        run: |
          set -euo pipefail
          test -f trust-page/index.html
          test -f trust-page/trust/gcp-release.json
          test -f trust-page/trust/image-digest-gcp.txt
          test -f trust-page/trust/image-reference-gcp.txt
          test -f trust-page/trust/accepted-image-digests-gcp.txt
          test -f trust-page/trust/accepted-image-references-gcp.txt
          if grep -Rqi '<script' trust-page; then
            echo "trust page must not contain <script>" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("trust-page/trust/gcp-release.json").read_text())
          assert release["platform"] == "gcp-confidential-space"
          assert release["data_policy"]["prompt_output_storage"] is False
          assert release["data_policy"]["control_plane_prompt_access"] is False
          assert release["tls"]["hostname"] == "api.trustedrouter.com"
          assert release["source_repositories"]["control_plane"].endswith("/quill-router")
          assert release["source_repositories"]["attested_gateway"].endswith("/quill-cloud-proxy")
          assert release["image_digest"].startswith("sha256:")
          accepted = release["accepted_image_digests"]
          accepted_references = release["accepted_image_references"]
          assert accepted and release["image_digest"] in accepted
          assert accepted_references and release["image_reference"] in accepted_references
          assert release["release_state"] == (
              "current"
              if accepted == [release["image_digest"]]
              and accepted_references == [release["image_reference"]]
              else "rolling"
          )
          assert release["source_commit"]
          assert Path("trust-page/trust/image-digest-gcp.txt").read_text().strip() == release["image_digest"]
          assert Path("trust-page/trust/image-reference-gcp.txt").read_text().strip() == release["image_reference"]
          assert Path("trust-page/trust/accepted-image-digests-gcp.txt").read_text().strip() == ",".join(accepted)
          assert Path("trust-page/trust/accepted-image-references-gcp.txt").read_text().strip() == ",".join(accepted_references)
          PY
      - name: Validate AWS and Azure trust records
        run: |
          set -euo pipefail
          # The GCP block above is thorough because GCP's record is produced by
          # this pipeline. AWS and Azure records are produced out of band by
          # tools/capture-plane-measurements.py, so what needs guarding here is
          # internal consistency: the scalar, the accepted set, and the .txt
          # mirrors must agree. trust-page/pcr0.txt is checked explicitly — it
          # is the legacy path that served a value matching no running enclave
          # from the initial commit until 2026-08-15, and the reason it went
          # unnoticed is that nothing ever compared it to anything.
          python3 - <<'PY'
          import json
          from pathlib import Path

          trust = Path("trust-page/trust")

          aws = json.loads((trust / "aws-release.json").read_text())
          assert aws["platform"] == "aws-nitro-enclaves"
          assert aws["measurement_type"] == "nitro-pcr0-sha384"
          assert len(aws["pcr0"]) == 96, "PCR0 must be 48 bytes of hex (SHA-384)"
          int(aws["pcr0"], 16)
          assert aws["pcr0"] in aws["accepted_pcr0s"], (
              "the value expected to be serving is not in its own accepted set"
          )
          assert aws["data_policy"]["prompt_output_storage"] is False
          assert (trust / "pcr0-aws.txt").read_text().strip() == aws["pcr0"]
          assert (trust / "accepted-pcr0s-aws.txt").read_text().strip() == ",".join(
              aws["accepted_pcr0s"]
          )
          legacy = Path("trust-page/pcr0.txt").read_text().strip()
          assert legacy == aws["pcr0"], (
              f"legacy trust-page/pcr0.txt ({legacy[:16]}...) disagrees with the "
              f"current record ({aws['pcr0'][:16]}...). Two paths publishing "
              "different measurements is exactly the defect this check exists for; "
              "re-run tools/capture-plane-measurements.py --write."
          )

          azure = json.loads((trust / "azure-release.json").read_text())
          assert azure["platform"] == "azure-confidential-containers-sev-snp"
          assert azure["measurement_type"] == "sev-snp-hostdata-sha256"
          assert len(azure["hostdata"]) == 64, "hostdata must be 32 bytes of hex"
          int(azure["hostdata"], 16)
          assert azure["hostdata"] in azure["accepted_hostdata"]
          assert azure["attestation_issuers"], "an MAA record with no issuer is unverifiable"
          assert azure["data_policy"]["prompt_output_storage"] is False
          assert (trust / "hostdata-azure.txt").read_text().strip() == azure["hostdata"]
          assert (trust / "accepted-hostdata-azure.txt").read_text().strip() == ",".join(
              azure["accepted_hostdata"]
          )
          print("AWS and Azure trust records are internally consistent")
          PY
      # Sign on the surface customers actually reach. Until now the cosign
      # bundles existed only on the S3 mirror; every .bundle on
      # trust.trustedrouter.com returned 404, so the transparency-log property
      # was real but unreachable from the page the trust page links to.
      # Keyless signing binds each file to this workflow's GitHub OIDC identity
      # and records it in Rekor, which is where the timing and immutability
      # come from — no long-lived key of ours is involved.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Sign published trust artifacts (keyless, Rekor-recorded)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in trust-page/pcr0.txt trust-page/trust/*.json trust-page/trust/*.txt; do
            cosign sign-blob --bundle "$f.bundle" "$f"
          done
          # Bundles are self-contained: signature, ephemeral cert, and Rekor
          # inclusion proof. Verifying one needs no call to Rekor. Finding the
          # NEWEST record does — see trust-page/index.html for the identity to
          # pin when querying the log.
          ls -1 trust-page/trust/*.bundle trust-page/*.bundle | wc -l | xargs echo "bundles signed:"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ inputs.artifact_name || 'github-pages' }}
          path: trust-page/
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ inputs.artifact_name || 'github-pages' }}
        # Pages deployments fail transiently (deployment conflicts, API
        # blips). Don't fail the job on the first attempt; retry once
        # after a backoff below.
        continue-on-error: true
      - name: Backoff before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ inputs.artifact_name || 'github-pages' }}
      - name: Verify live page matches repo artifacts
        env:
          EXPECTED_DIGESTS: ${{ inputs.expected_digests }}
          EXPECTED_REFERENCES: ${{ inputs.expected_references }}
        run: |
          set -euo pipefail
          expected="${EXPECTED_DIGESTS:-$(cat trust-page/trust/accepted-image-digests-gcp.txt)}"
          expected_references="${EXPECTED_REFERENCES:-$(cat trust-page/trust/accepted-image-references-gcp.txt)}"
          expected_target="$(cat trust-page/trust/image-digest-gcp.txt)"
          expected_target_reference="$(cat trust-page/trust/image-reference-gcp.txt)"
          echo "expected digest: ${expected}"
          for attempt in $(seq 1 30); do
            live="$(curl -fsS "https://trust.trustedrouter.com/trust/accepted-image-digests-gcp.txt?nocache=${GITHUB_RUN_ID}-${attempt}" || true)"
            live_references="$(curl -fsS "https://trust.trustedrouter.com/trust/accepted-image-references-gcp.txt?nocache=${GITHUB_RUN_ID}-${attempt}" || true)"
            live_target="$(curl -fsS "https://trust.trustedrouter.com/trust/image-digest-gcp.txt?nocache=${GITHUB_RUN_ID}-${attempt}" || true)"
            live_target_reference="$(curl -fsS "https://trust.trustedrouter.com/trust/image-reference-gcp.txt?nocache=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "${live}" = "${expected}" ] && [ "${live_references}" = "${expected_references}" ] && [ "${live_target}" = "${expected_target}" ] && [ "${live_target_reference}" = "${expected_target_reference}" ]; then
              echo "live trust page matches repo artifacts"
              exit 0
            fi
            echo "attempt ${attempt}: accepted_digests='${live}' target_digest='${live_target}' — waiting for Pages/CDN propagation"
            sleep 20
          done
          echo "live trust page still does not match repo artifacts after 10 minutes" >&2
          exit 1
