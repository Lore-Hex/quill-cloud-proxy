# NS-drift check for all canonical and independent backup domains.
#
# Why this exists
# ───────────────
# trustedrouter.com and quillrouter.com now delegate at the registrar
# to Google Cloud DNS only. This workflow catches the opposite failure
# mode: an accidental registrar-side NS change that would make a stale
# DNS vendor authoritative again.
#
# This workflow catches that exact failure mode by directly querying
# the .com TLD nameservers for the NS records and diffing against
# the known-expected Google Cloud DNS NS set per zone.
#
# A red run files an issue. It used to rely on "operator notification through
# the standard GitHub Actions failure email / Slack / whatever's wired up",
# which nobody had verified: between 2026-08-11 and 2026-08-20 this workflow
# failed 40 consecutive times and produced zero tickets. A detection control
# reporting into a channel no one has proved exists is not operating, however
# correct its logic is.
#
# Cadence: every six hours. NS drift is slow, but this workflow also checks
# public TLS expiry and must warn well before a renewal failure becomes an
# outage. Offset by seven minutes so it does not collide with hourly jobs.
#
# Fix path on red: see docs/runbook.md "DNS-vendor-split symptoms"
# in the quill-router repo, plus tools/dns/main.tf in this repo.

name: DNS NS-drift check

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: check-dns
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # continue-on-error so a real NS incident does not switch off certificate
      # monitoring. Before this, `exit "$fail"` ended the job here and the TLS
      # step never ran — the two failure modes this workflow exists to catch
      # were wired so that either one hid the other.
      - name: Query authoritative NS for each zone
        id: ns
        continue-on-error: true
        run: |
          set -euo pipefail
          # Expected NS sets — what tools/dns/main.tf says should be
          # at the registrar (the .com TLD parent zone). Sort + join
          # so the diff is order-insensitive.
          # If you change the NS list (e.g. add a third vendor),
          # update both the Terraform module AND these expected
          # values in lockstep.
          expected_tr="ns-cloud-b1.googledomains.com.,ns-cloud-b2.googledomains.com.,ns-cloud-b3.googledomains.com.,ns-cloud-b4.googledomains.com."
          expected_qr="ns-cloud-d1.googledomains.com.,ns-cloud-d2.googledomains.com.,ns-cloud-d3.googledomains.com.,ns-cloud-d4.googledomains.com."
          expected_ar="ns-1324.awsdns-37.org.,ns-1917.awsdns-47.co.uk.,ns-556.awsdns-05.net.,ns-82.awsdns-10.com."
          expected_ur="ns-1243.awsdns-27.org.,ns-1544.awsdns-01.co.uk.,ns-509.awsdns-63.com.,ns-855.awsdns-42.net."

          fail=0
          for pair in trustedrouter.com:"$expected_tr" quillrouter.com:"$expected_qr" allyrouter.com:"$expected_ar" uptimerouter.com:"$expected_ur"; do
            d="${pair%%:*}"
            expected="${pair#*:}"
            # Query the TLD directly so we get what the REGISTRY has
            # (not what either vendor's child zone says about itself
            # — those two views differ, and the registry is the
            # authoritative one for delegation).
            #
            # `+short` doesn't print NS records from a parent-zone
            # response (delegations live in the AUTHORITY section,
            # not ANSWER); use `+noall +authority` and parse the
            # NS rows out of the bind-format response.
            actual=$(dig NS "$d" @a.gtld-servers.net +noall +authority +timeout=5 \
              | awk '/IN[[:space:]]+NS/ {print $5}' | sort | paste -sd, -)
            if [ "$actual" = "$expected" ]; then
              echo "$d: ✓ NS list matches expected ($(echo "$expected" | tr ',' '\n' | wc -l | tr -d ' ') records)"
            else
              echo "::error::$d NS drift detected"
              echo "  expected: $expected"
              echo "  actual:   $actual"
              {
                echo "$d NS drift detected"
                echo "  expected: $expected"
                echo "  actual:   $actual"
              } >> /tmp/dns-problems.txt
              fail=1
            fi
          done

          # Also sanity-check that Google Cloud DNS still answers
          # authoritatively for each zone. Cheap to verify: one dig
          # against one delegated nameserver per zone.
          for pair in trustedrouter.com:ns-cloud-b1.googledomains.com quillrouter.com:ns-cloud-d1.googledomains.com allyrouter.com:ns-1324.awsdns-37.org uptimerouter.com:ns-855.awsdns-42.net; do
            d="${pair%%:*}"
            ns="${pair#*:}"
            if ! dig +short +tries=2 +timeout=5 NS "$d" "@$ns" | grep -q .; then
              echo "::error::$d not answered by $ns (vendor outage or removed-from-zone)"
              echo "$d not answered by $ns (vendor outage or removed-from-zone)" >> /tmp/dns-problems.txt
              fail=1
            fi
          done

          exit "$fail"

      - name: Check public TLS validity and expiry
        id: tls
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/check-public-tls.py --minimum-days 14 2>&1 | tee /tmp/tls-output.txt
        # api-aws.trustedrouter.com is deliberately absent from the probed set:
        # it serves an attested self-signed certificate and cannot pass public-CA
        # validation. See tools/check-public-tls.py ATTESTED_SELF_SIGNED_HOSTS.

      - name: Collect TLS problems
        if: always()
        run: |
          set -euo pipefail
          if [ -f /tmp/tls-output.txt ]; then
            grep '^::error::' /tmp/tls-output.txt | sed 's/^::error:://' >> /tmp/dns-problems.txt || true
          fi

      # Fail the job for either cause, after both checks have run.
      - name: Fail if NS or TLS checks failed
        if: always()
        run: |
          set -euo pipefail
          ns='${{ steps.ns.outcome }}'
          tls='${{ steps.tls.outcome }}'
          echo "ns=${ns} tls=${tls}"
          if [ "${ns}" != "success" ] || [ "${tls}" != "success" ]; then
            echo "::error::DNS/TLS check failed (ns=${ns}, tls=${tls})"
            exit 1
          fi

      # One open issue at a time, same pattern as verify-trust-freshness.yml.
      # A check that files a duplicate every six hours trains you to ignore it,
      # and being ignored is how a permanently-red signal stops being a signal.
      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s /tmp/dns-problems.txt ]; then
            cp /tmp/dns-problems.txt /tmp/detail.txt
          else
            echo "the DNS/TLS check failed; see the run log" > /tmp/detail.txt
          fi
          {
            echo "The scheduled DNS NS-drift and public-TLS check failed."
            echo
            echo '```'
            cat /tmp/detail.txt
            echo '```'
            echo
            echo "**NS drift** means the registrar's delegation no longer matches"
            echo "tools/dns/main.tf. Fix path: docs/runbook.md \"DNS-vendor-split symptoms\""
            echo "in quill-router, plus tools/dns/main.tf here. Update the Terraform module"
            echo "AND the expected values in this workflow in lockstep."
            echo
            echo "**TLS expiry** means a public certificate is inside the 14-day warning"
            echo "window, or a host failed to present a valid chain. Per-region gateway names"
            echo "are probed directly because the canonical names rotate to whichever region"
            echo "is healthy, so one region can run its certificate to zero unalerted."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/issue-body.md
          existing="$(gh issue list --label dns-drift --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file /tmp/issue-body.md
          else
            gh issue create \
              --title "DNS NS-drift or public TLS check failed" \
              --label dns-drift \
              --body-file /tmp/issue-body.md
          fi
