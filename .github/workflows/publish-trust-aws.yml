name: Publish trust record (aws)

# One workflow FILE per plane, and that is the entire point of the split.
# Fulcio embeds the workflow file path in the certificate SAN — verified off a
# live bundle:
#
#   URI:https://github.com/Lore-Hex/quill-cloud-proxy/.github/workflows/deploy.yml@refs/heads/main
#
# so three files mint three cryptographically distinct identities. A verifier
# pinning the exact identity below will REJECT a aws record signed by any
# other workflow in this repository, which is what makes each plane's authority
# independent rather than shared. Signing all three from one workflow would have
# looked identical on the page and quietly given every plane the same authority.
#
# The identity a verifier pins for this plane:
#   https://github.com/Lore-Hex/quill-cloud-proxy/.github/workflows/publish-trust-aws.yml@refs/heads/main

on:
  push:
    branches: [main]
    paths:
      - "trust-page/trust/aws-release.json"
      - "trust-page/trust/pcr0-aws.txt"
      - "trust-page/trust/accepted-pcr0s-aws.txt"
      - "trust-page/trust/eif/**"
      - "trust-page/pcr0.txt"
      - "trust-page/trust/retractions/*.json"
      - ".github/workflows/publish-trust-aws.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # commit the signed bundles
  id-token: write   # Fulcio keyless signing

concurrency:
  group: publish-trust-aws
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Match the attested release workflow's protected-main publisher.
          # Signing still uses this workflow's separate OIDC identity.
          token: ${{ secrets.TRUST_PUSH_TOKEN }}
          fetch-depth: 0   # the source_commit check resolves an arbitrary sha
      # The installer downloads cosign from GitHub Releases once, with no
      # retry; on 2026-11-09 that download failed in three runs within 16
      # minutes and stranded a deploy. A failed first install is retried once
      # after a pause. The retry has no continue-on-error, so a second failure
      # still fails the job (tools/test_check_trust_signatures.py checks this).
      - id: cosign-install
        uses: Lore-Hex/quill-cloud-proxy/.github/actions/cosign-install@582cbdee7b7023cfeb915b62a7f635aa1e4662b1 # main 2026-11-13
        continue-on-error: true
        with:
          cosign-release: v2.6.5
      - if: steps.cosign-install.outcome == 'failure'
        run: sleep 30
      - if: steps.cosign-install.outcome == 'failure'
        uses: Lore-Hex/quill-cloud-proxy/.github/actions/cosign-install@582cbdee7b7023cfeb915b62a7f635aa1e4662b1 # main 2026-11-13
        with:
          cosign-release: v2.6.5
      - name: Verify staged EIF admission against the independent CI signature
        run: python3 -m tools.aws_eif_admission verify-record
      - name: Bind the primary PCR0 to the independent build workflow before signing
        run: python3 -m tools.aws_eif_admission verify-primary-build
      - name: Sign the AWS Nitro Enclaves record
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for f in trust-page/trust/aws-release.json trust-page/trust/pcr0-aws.txt trust-page/trust/accepted-pcr0s-aws.txt trust-page/pcr0.txt; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
            cosign sign-blob --bundle "$f.bundle" "$f"
          done
          # trust-page/ carries a byte-identical copy of each record, as it does
          # for GCP. A record names its bundle relative to itself, so each copy
          # gets the same bundle beside it.
          for f in trust-page/trust/aws-release.json trust-page/trust/pcr0-aws.txt trust-page/trust/accepted-pcr0s-aws.txt; do
            top="trust-page/$(basename "$f")"
            cmp "$f" "$top" || { echo "$top differs from $f" >&2; exit 1; }
            cp "$f.bundle" "$top.bundle"
          done
          # Retractions are signed under the SAME identity as the records they
          # correct, and land in the same append-only log. The log already holds
          # a signed statement of ours that was false; it cannot be removed, so
          # the correction is published beside it rather than instead of it.
          shopt -s nullglob
          for f in trust-page/trust/retractions/*.json; do
            cosign sign-blob --bundle "$f.bundle" "$f"
          done
      - name: Verify each signature under THIS workflow's identity
        run: |
          set -euo pipefail
          # Verifying with the exact identity proves the split actually worked.
          # If these files were signed elsewhere, this fails — which is the
          # property the whole design rests on, so it is asserted, not assumed.
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-trust-aws.yml@${GITHUB_REF}"
          for f in trust-page/trust/aws-release.json trust-page/trust/pcr0-aws.txt trust-page/trust/accepted-pcr0s-aws.txt trust-page/pcr0.txt; do
            cosign verify-blob \
              --bundle "$f.bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done
          for f in trust-page/trust/aws-release.json trust-page/trust/pcr0-aws.txt trust-page/trust/accepted-pcr0s-aws.txt; do
            top="trust-page/$(basename "$f")"
            cosign verify-blob \
              --bundle "$top.bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$top"
          done
          echo "all aws artifacts verify under $identity"
      # Commit the bundles so they reach the PUBLISHED surface. Uploading them
      # as CI artifacts left the signatures reachable only from a workflow run,
      # while trust.trustedrouter.com served bundles signed by the page
      # publisher instead — so the exact-identity command the trust page
      # documents FAILED against the bundle it pointed at. Verified before this
      # change: documented publish-trust-aws.yml, actual publish-trust-page.yml.
      #
      # Bundle-only commits do not match this signer's input paths.
      # Pages also has a workflow_run backstop when this signer completes.
      - name: Commit bundles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'trust-page/**/*.bundle' 'trust-page/*.bundle' || true
          if git diff --cached --quiet; then
            echo "no bundle changes"
            exit 0
          fi
          git commit -m "[bot] sign aws trust artifacts"
          # Another plane's workflow may have pushed first; rebase rather than
          # fail, since these commits only ever touch disjoint bundle files.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push signed bundles" >&2
          exit 1
