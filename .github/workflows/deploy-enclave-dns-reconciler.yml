name: Deploy enclave DNS reconciler

on:
  push:
    branches: [main]
    paths:
      - "tools/reconcile-enclave-dns.py"
      - "tools/test_reconcile_enclave_dns.py"
      - "tools/test_dns_reconciler_scheduler.py"
      - "tools/verify-attestation.py"
      - "tools/test_verify_attestation.py"
      - "tools/Dockerfile.reconciler"
      - "tools/cloudbuild.reconciler.yaml"
      - ".github/workflows/deploy-enclave-dns-reconciler.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-enclave-dns-reconciler
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: quill-cloud-proxy
  REGION: us-central1
  IMAGE_REPOSITORY: us-central1-docker.pkg.dev/quill-cloud-proxy/quill/enclave-dns-reconciler
  JOB_NAME: enclave-dns-reconciler
  SCHEDULER_NAME: enclave-dns-reconciler-tick
  SCHEDULER_SCHEDULE: "*/2 * * * *"
  SCHEDULER_SERVICE_ACCOUNT: enclave-dns-reconciler-invoker@quill-cloud-proxy.iam.gserviceaccount.com
  RECONCILER_SERVICE_ACCOUNT: enclave-dns-reconciler@quill-cloud-proxy.iam.gserviceaccount.com
  LOCK_BUCKET: quill-cloud-proxy-enclave-dns-reconciler-state

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Test verifier and reconciler
        run: |
          set -euo pipefail
          uv run --script tools/verify-attestation.py --help >/dev/null
          python3 tools/test_verify_attestation.py
          python3 tools/test_reconcile_enclave_dns.py
          python3 tools/test_dns_reconciler_scheduler.py

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Reconcile the single-flight state bucket
        run: |
          set -euo pipefail
          if ! gcloud storage buckets describe "gs://${LOCK_BUCKET}" \
            --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${LOCK_BUCKET}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --default-storage-class=STANDARD \
              --uniform-bucket-level-access \
              --public-access-prevention \
              --soft-delete-duration=0 \
              --quiet
          fi
          gcloud storage buckets update "gs://${LOCK_BUCKET}" \
            --project="${PROJECT_ID}" \
            --uniform-bucket-level-access \
            --public-access-prevention \
            --no-versioning \
            --clear-soft-delete \
            --quiet
          gcloud storage buckets add-iam-policy-binding "gs://${LOCK_BUCKET}" \
            --project="${PROJECT_ID}" \
            --member="serviceAccount:${RECONCILER_SERVICE_ACCOUNT}" \
            --role=roles/storage.objectUser \
            --condition=None \
            --quiet

      - name: Build immutable reconciler image
        id: image
        run: |
          set -euo pipefail
          tag="reconciler-${GITHUB_SHA::12}"
          image="${IMAGE_REPOSITORY}:${tag}"
          gcloud builds submit \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --config=tools/cloudbuild.reconciler.yaml \
            --substitutions="_IMAGE=${image},_SOURCE_REVISION=${GITHUB_SHA}" \
            tools
          digest="$(gcloud artifacts docker images describe "${image}" \
            --project="${PROJECT_ID}" \
            --format='value(image_summary.digest)')"
          test -n "${digest}"
          echo "ref=${IMAGE_REPOSITORY}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Update the reconciler job and scheduler
        run: |
          set -euo pipefail
          gcloud run jobs update "${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${{ steps.image.outputs.ref }}" \
            --update-env-vars="QUILL_RECONCILE_LOCK_BUCKET=${LOCK_BUCKET}"

          run_uri="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_ID}/jobs/${JOB_NAME}:run"
          retry_flags=(
            # Four total attempts finish within 85 seconds even when every
            # HTTP attempt consumes Cloud Scheduler's 15-second minimum
            # deadline. That leaves 35 seconds before the next two-minute tick.
            --attempt-deadline=15s
            --max-retry-attempts=3
            --min-backoff=5s
            --max-backoff=10s
            --max-doublings=1
          )
          describe_error="$(mktemp)"
          trap 'rm -f "${describe_error}"' EXIT
          if gcloud scheduler jobs describe "${SCHEDULER_NAME}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" >/dev/null 2>"${describe_error}"; then
            gcloud scheduler jobs update http "${SCHEDULER_NAME}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --schedule="${SCHEDULER_SCHEDULE}" \
              --uri="${run_uri}" \
              --http-method=POST \
              --oauth-service-account-email="${SCHEDULER_SERVICE_ACCOUNT}" \
              "${retry_flags[@]}"
          else
            describe_status=$?
            if ! grep -Eqi 'NOT_FOUND|not found' "${describe_error}"; then
              cat "${describe_error}" >&2
              exit "${describe_status}"
            fi
            gcloud scheduler jobs create http "${SCHEDULER_NAME}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --schedule="${SCHEDULER_SCHEDULE}" \
              --uri="${run_uri}" \
              --http-method=POST \
              --oauth-service-account-email="${SCHEDULER_SERVICE_ACCOUNT}" \
              "${retry_flags[@]}"
          fi

      - name: Verify scheduler authentication path
        run: |
          set -euo pipefail
          before="$(gcloud run jobs executions list \
            --job="${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --limit=1 \
            --format='value(metadata.name)')"
          gcloud scheduler jobs run "${SCHEDULER_NAME}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}"
          scheduler_execution=""
          for _ in $(seq 1 24); do
            latest="$(gcloud run jobs executions list \
              --job="${JOB_NAME}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --limit=1 \
              --format='value(metadata.name)')"
            if [ -n "${latest}" ] && [ "${latest}" != "${before}" ]; then
              scheduler_execution="${latest}"
              break
            fi
            sleep 5
          done
          test -n "${scheduler_execution}"
          for _ in $(seq 1 72); do
            status="$(gcloud run jobs executions describe "${scheduler_execution}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --format='value(status.conditions[0].status)')"
            case "${status}" in
              True)
                exit 0
                ;;
              False)
                gcloud run jobs executions describe "${scheduler_execution}" \
                  --project="${PROJECT_ID}" \
                  --region="${REGION}"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for ${scheduler_execution}" >&2
          exit 1
