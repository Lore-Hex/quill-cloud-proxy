name: Publish trust record (gcp)

# One workflow FILE per plane, and that is the entire point of the split.
# Fulcio embeds the workflow file path in the certificate SAN — verified off a
# live bundle:
#
#   URI:https://github.com/Lore-Hex/quill-cloud-proxy/.github/workflows/deploy.yml@refs/heads/main
#
# so three files mint three cryptographically distinct identities. A verifier
# pinning the exact identity below will REJECT a gcp record signed by any
# other workflow in this repository, which is what makes each plane's authority
# independent rather than shared. Signing all three from one workflow would have
# looked identical on the page and quietly given every plane the same authority.
#
# The identity a verifier pins for this plane:
#   https://github.com/Lore-Hex/quill-cloud-proxy/.github/workflows/publish-trust-gcp.yml@refs/heads/main

on:
  push:
    branches: [main]
    paths:
      - "trust-page/trust/gcp-release.json"
      - "trust-page/trust/image-digest-gcp.txt"
      - "trust-page/trust/image-reference-gcp.txt"
      - "trust-page/trust/accepted-image-digests-gcp.txt"
      - "trust-page/trust/accepted-image-references-gcp.txt"
      - "trust-page/gcp/stage-d-accepted.json"
      - "trust-page/trust/gcp/stage-d-accepted.json"
      - ".github/workflows/publish-trust-gcp.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # commit the signed bundles
  id-token: write   # Fulcio keyless signing

concurrency:
  group: publish-trust-gcp
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Sign the GCP Confidential Space record
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          stage_d_policy=trust-page/gcp/stage-d-accepted.json
          # The workflow-file change may run once before the first deploy has
          # created this new artifact. Every policy-triggered run includes it.
          for f in trust-page/trust/gcp-release.json trust-page/trust/image-digest-gcp.txt trust-page/trust/image-reference-gcp.txt trust-page/trust/accepted-image-digests-gcp.txt trust-page/trust/accepted-image-references-gcp.txt trust-page/gcp/stage-d-accepted.json; do
            if [ "$f" = "$stage_d_policy" ] && [ ! -f "$f" ]; then
              continue
            fi
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
            if [ "$f" = "$stage_d_policy" ]; then
              # The router's sigstore.models.Bundle.from_json consumer requires
              # protobuf JSON. Incident: the legacy bundle left its accepted
              # digest set empty, blocking enclave boots and spend leases.
              cosign sign-blob --new-bundle-format --bundle "$f.bundle" "$f"
              # The router resolves this policy relative to /trust/gcp-release.json.
              # Publish the same signed bytes at both paths; signing twice would
              # produce different bundles even for an identical document.
              mkdir -p trust-page/trust/gcp
              cp "$f" trust-page/trust/gcp/stage-d-accepted.json
              cp "$f.bundle" trust-page/trust/gcp/stage-d-accepted.json.bundle
            else
              cosign sign-blob --bundle "$f.bundle" "$f"
            fi
          done
      - name: Verify each signature under THIS workflow's identity
        run: |
          set -euo pipefail
          # Verifying with the exact identity proves the split actually worked.
          # If these files were signed elsewhere, this fails — which is the
          # property the whole design rests on, so it is asserted, not assumed.
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-trust-gcp.yml@${GITHUB_REF}"
          stage_d_policy=trust-page/gcp/stage-d-accepted.json
          for f in trust-page/trust/gcp-release.json trust-page/trust/image-digest-gcp.txt trust-page/trust/image-reference-gcp.txt trust-page/trust/accepted-image-digests-gcp.txt trust-page/trust/accepted-image-references-gcp.txt trust-page/gcp/stage-d-accepted.json; do
            if [ "$f" = "$stage_d_policy" ] && [ ! -f "$f" ]; then
              continue
            fi
            if [ "$f" = "$stage_d_policy" ]; then
              cmp "$f" trust-page/trust/gcp/stage-d-accepted.json
              cmp "$f.bundle" trust-page/trust/gcp/stage-d-accepted.json.bundle
              cosign verify-blob --new-bundle-format \
                --bundle "$f.bundle" \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$f"
            else
              cosign verify-blob \
                --bundle "$f.bundle" \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$f"
            fi
          done
          echo "all gcp artifacts verify under $identity"
      # Commit the bundles so they reach the PUBLISHED surface. Uploading them
      # as CI artifacts left the signatures reachable only from a workflow run,
      # while trust.trustedrouter.com served bundles signed by the page
      # publisher instead — so the exact-identity command the trust page
      # documents FAILED against the bundle it pointed at. Verified before this
      # change: documented publish-trust-gcp.yml, actual publish-trust-page.yml.
      #
      # GITHUB_TOKEN pushes do not trigger push workflows, so this cannot loop.
      # Publishing to Pages happens on the workflow_run backstop in
      # publish-trust-page.yml, which fires when this workflow completes.
      - name: Commit bundles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'trust-page/**/*.bundle' 'trust-page/*.bundle' || true
          if [ -f trust-page/gcp/stage-d-accepted.json ]; then
            git add -- trust-page/trust/gcp/stage-d-accepted.json
          fi
          if git diff --cached --quiet; then
            echo "no bundle changes"
            exit 0
          fi
          git commit -m "[bot] sign gcp trust artifacts"
          # Another plane's workflow may have pushed first; rebase rather than
          # fail, since these commits touch disjoint per-plane artifacts.
          for attempt in 1 2 3; do
            echo "bundle push attempt ${attempt}/3"
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push signed bundles" >&2
          exit 1
