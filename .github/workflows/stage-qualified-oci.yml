name: Stage verified gateway image bytes
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact green main commit for the GCP and Azure gateways (no rollout)
        type: string
        required: true
permissions:
  contents: read
jobs:
  gate:
    if: github.ref == 'refs/heads/main' && github.repository == 'Lore-Hex/quill-cloud-proxy'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact green source before any registry writes
        env:
          SOURCE: ${{ inputs.source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE" origin/main
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$SOURCE" \
            --event push --limit 1 --json status,conclusion,headSha | \
            jq -e --arg sha "$SOURCE" '. == [{status:"completed", conclusion:"success", headSha:$sha}]'
  qualify:
    needs: gate
    uses: ./.github/workflows/qualify-release-oci.yml
    with:
      source: ${{ inputs.source }}
  stage-gcp:
    needs: qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Lore-Hex/quill-cloud-proxy/.github/actions/gcp-auth@582cbdee7b7023cfeb915b62a7f635aa1e4662b1
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com
      - uses: Lore-Hex/quill-cloud-proxy/.github/actions/setup-gcloud@582cbdee7b7023cfeb915b62a7f635aa1e4662b1
      - uses: ./.github/actions/stage-qualified-oci
        with:
          plane: gcp
          source: ${{ inputs.source }}
          expected: ${{ needs.qualify.outputs.gcp }}
  stage-azure:
    environment: azure-gateway-rollout
    needs: qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the existing Azure release identity
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_GATEWAY_ROLLOUT_CLIENT_ID }}
          AZURE_TENANT_ID: 2abe2fae-5c28-491d-af5a-6255b33e534e
          AZURE_SUBSCRIPTION_ID: 2fc83893-ca6c-48e4-b090-8860fba33d33
        run: bash tools/azure-oidc-login.sh
      - uses: ./.github/actions/stage-qualified-oci
        with:
          plane: azure
          source: ${{ inputs.source }}
          expected: ${{ needs.qualify.outputs.azure }}
