name: Verify Privatemode manifest

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "tools/check_privatemode_manifest.py"
      - "tools/test_check_privatemode_manifest.py"
      - ".github/workflows/verify-privatemode-manifest.yml"

permissions:
  contents: read

concurrency:
  group: privatemode-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tools -p test_check_privatemode_manifest.py
      - name: Detect upstream deployment drift without changing trust
        if: github.event_name != 'pull_request'
        run: python3 tools/check_privatemode_manifest.py
