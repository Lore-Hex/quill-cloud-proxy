name: Verify trust freshness

# Compares every published measurement against a live attestation from the plane
# it claims to describe, and fails loudly when they disagree.
#
# This exists because publishing a measurement and checking it were never the
# same act. trust-page/pcr0.txt was published from the initial commit onward and
# matched no running enclave for months. Nothing was broken, exactly — there was
# simply no step anywhere that compared the number we published to the number
# that was running, so drift had no way to become visible.
#
# Signing does not solve this and neither does Rekor. A transparency log proves
# when a record was signed and that it has not been altered; it cannot know
# whether the enclave was rebuilt afterwards. An eight-month-old signature on a
# deployment that genuinely has not changed is correct. Only this comparison
# distinguishes the two.
#
# The S3 mirror publisher dispatches this workflow only after both independent
# surfaces match the repository. An explicit dispatch avoids GitHub's three-level
# workflow_run chaining limit when a signing workflow started publication. The
# schedule catches enclave rebuilds that do not touch this repository.

on:
  schedule:
    # Twice daily. Drift is not urgent within hours, but it must not survive a
    # weekend unnoticed.
    - cron: "23 6,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-trust-freshness
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cbor2
      - name: Compare PUBLISHED bytes to live attestations
        id: compare
        env:
          # Every surface that serves a measurement. Reading the repo instead of
          # these URLs is the mistake this file was written to catch: the repo
          # can hold the correct value while a surface still serves the old one,
          # because publishing is a separate act from committing. An earlier
          # draft of this very workflow compared against the checked-out repo
          # and would have reported green while trust.trustedrouter.com served
          # a PCR0 matching no running enclave.
          SURFACES: >-
            https://trust.trustedrouter.com
            https://trust.quill.lorehex.co
        run: |
          set -euo pipefail
          python3 tools/capture-plane-measurements.py > /tmp/live.txt 2>&1 || true
          cat /tmp/live.txt
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request

          live = open("/tmp/live.txt").read()
          problems = []

          def observed(pattern):
              match = re.search(pattern, live)
              return match.group(1) if match else None

          running = {
              "gcp": observed(r"GCP   digest   (sha256:[0-9a-f]{64})"),
              "aws": observed(r"AWS   PCR0     ([0-9a-f]{96})"),
              "azure": observed(r"Azure hostdata ([0-9a-f]{64})"),
          }

          def get(url):
              request = urllib.request.Request(url, headers={"cache-control": "no-cache"})
              with urllib.request.urlopen(request, timeout=30) as response:  # noqa: S310
                  return response.read().decode()

          # Compared against the ACCEPTED SET, never the scalar. During a roll
          # the live plane legitimately serves the outgoing measurement while the
          # record already names the incoming one — GCP was mid-roll when this
          # was written, live a781e99 against target 7a32069, both accepted. A
          # check pinned to the scalar would cry wolf on every single deploy.
          PLANES = (
              ("gcp", "gcp-release.json", "image_digest", "accepted_image_digests", "image-digest-gcp.txt"),
              ("aws", "aws-release.json", "pcr0", "accepted_pcr0s", "pcr0-aws.txt"),
              ("azure", "azure-release.json", "hostdata", "accepted_hostdata", "hostdata-azure.txt"),
          )

          for surface in os.environ["SURFACES"].split():
              for plane, record_name, scalar, accepted_key, mirror in PLANES:
                  value = running[plane]
                  if value is None:
                      problems.append(f"could not read a live measurement from the {plane} plane")
                      continue
                  url = f"{surface}/trust/{record_name}"
                  try:
                      record = json.loads(get(url))
                  except (urllib.error.URLError, ValueError) as exc:
                      problems.append(f"{url} is not serving a readable record ({exc})")
                      continue
                  if value not in record.get(accepted_key, []):
                      problems.append(
                          f"{url} publishes {record.get(accepted_key)} but the {plane} plane "
                          f"is running {value}"
                      )
                  try:
                      mirrored = get(f"{surface}/trust/{mirror}").strip()
                  except (urllib.error.URLError, ValueError) as exc:
                      problems.append(f"{surface}/trust/{mirror} is unreadable ({exc})")
                      continue
                  if mirrored != record.get(scalar):
                      problems.append(
                          f"{surface}: {mirror} says {mirrored} but {record_name} says "
                          f"{record.get(scalar)}"
                      )

          # The legacy path is checked by name because it is the one that was
          # wrong in public for months.
          for surface in os.environ["SURFACES"].split():
              try:
                  legacy = get(f"{surface}/pcr0.txt").strip()
              except (urllib.error.URLError, ValueError):
                  continue  # not every surface serves the legacy path
              if running["aws"] and legacy != running["aws"]:
                  problems.append(
                      f"{surface}/pcr0.txt serves {legacy} but the AWS plane is running "
                      f"{running['aws']}"
                  )

          if problems:
              print("::error::published trust records do not match what is running")
              for problem in problems:
                  print(f"  - {problem}")
              open("/tmp/problems.txt", "w").write("\n".join(problems))
              sys.exit(1)
          print("every published measurement, on every surface, matches a live attestation")
          PY
      - name: Open an issue on drift
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f /tmp/problems.txt ]; then
            cp /tmp/problems.txt /tmp/detail.txt
          else
            echo "the freshness check failed; see the run log" > /tmp/detail.txt
          fi
          {
            echo "The scheduled freshness check found a published measurement that no live attestation matches."
            echo
            echo '```'
            cat /tmp/detail.txt
            echo '```'
            echo
            echo "Fix by capturing what is actually running:"
            echo
            echo '```bash'
            echo "python3 tools/capture-plane-measurements.py --write --source-commit <sha>"
            echo '```'
            echo
            echo "--source-commit is the commit whose enclave-go tree built the enclave that is"
            echo "RUNNING NOW, which is exactly what this alert says has changed. It is not HEAD"
            echo "except by coincidence: this issue fires because what is published no longer"
            echo "matches what is serving, so main has usually moved past the released enclave."
            echo "Get it from the release that rolled the running build (the run log of"
            echo "tools/release-aws-enclave.sh, or the deploy that produced the new measurement)."
            echo "If nobody can name it, run without the flag: the record then says"
            echo "not-configured, and quill-router's envelope-format ordering gate refuses"
            echo "control-plane deploys against that cloud until a real commit is published."
            echo
            echo "During a bind window add --keep-accepted so the outgoing measurement stays"
            echo "acceptable while the old enclave is still serving."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/issue-body.md
          # One open issue at a time. A check that files a duplicate every twelve
          # hours trains you to ignore it, and being ignored is how the original
          # defect survived for months.
          existing="$(gh issue list --label trust-drift --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file /tmp/issue-body.md
          else
            gh issue create \
              --title "Published trust measurement does not match what is running" \
              --label trust-drift \
              --body-file /tmp/issue-body.md
          fi
