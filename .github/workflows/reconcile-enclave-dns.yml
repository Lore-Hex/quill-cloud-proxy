name: Reconcile enclave DNS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  # Coalesce repeated schedules while one run waits for the mutation lock.
  group: reconcile-enclave-dns
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  QUILL_NYTE_API_ALIASES_ENABLED: "1"
  QUILL_CANONICAL_GEO: ${{ vars.QUILL_CANONICAL_GEO || '0' }}
  QUILL_GEO_HEALTH_CHECK: ${{ vars.QUILL_GEO_HEALTH_CHECK }}

jobs:
  reconcile:
    # Share the deploy lock only at the job level. Keep at most one DNS job
    # waiting here without cancelling pending releases or replaying a backlog.
    concurrency:
      group: deploy-enclave-gcp
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GCP via WIF
        uses: Lore-Hex/quill-cloud-proxy/.github/actions/gcp-auth@PINSHA # main 2026-11-13
        with:
          workload_identity_provider: projects/44325983244/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: tr-deploy@quill-cloud-proxy.iam.gserviceaccount.com

      - name: Authenticate to AWS for backup-domain DNS
        uses: Lore-Hex/quill-cloud-proxy/.github/actions/aws-credentials@PINSHA # main 2026-11-13
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: Lore-Hex/quill-cloud-proxy/.github/actions/setup-gcloud@PINSHA # main 2026-11-13

      - name: Install uv
        uses: Lore-Hex/quill-cloud-proxy/.github/actions/setup-uv@PINSHA # main 2026-11-13

      - name: Reconcile canonical and regional DNS
        env:
          QUILL_RECONCILE_APPLY: "1"
          QUILL_API_HOST: api.trustedrouter.com
          QUILL_DNS_ZONE: trustedrouter-com
          QUILL_CANONICAL_DNS_MIRRORS: quillrouter-com:api.quillrouter.com.
          QUILL_PUBLISH_REGIONAL: "1"
          QUILL_REGIONAL_ZONE: quillrouter-com
          QUILL_REGIONAL_SUFFIX: quillrouter.com
        run: |
          uv run --script tools/reconcile-enclave-dns.py --apply
          python3 tools/sync-route53-api-aliases.py --apply

      - name: Verify canonical and permanent compatibility hostnames
        run: |
          set -euo pipefail
          for host in api.trustedrouter.com api.quillrouter.com; do
            curl --fail --silent --show-error \
              --retry 6 --retry-all-errors --retry-delay 10 \
              --connect-timeout 5 --max-time 15 \
              "https://${host}/health" >/dev/null
          done

      - name: Reconcile SES authentication DNS
        run: python3 tools/reconcile_ses_dns.py --apply
