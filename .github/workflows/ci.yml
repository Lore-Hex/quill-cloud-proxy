name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rampart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned model and test real local de-identification
        working-directory: enclave-go
        run: docker build --platform linux/amd64 -f rampart/Dockerfile.test -t tr-rampart-test .
      - name: Verify scratch runtime without network access
        run: |
          printf '%s' '{"texts":["My name is Alice Smith. Email alice@example.com."]}' | docker run --rm --network none -i tr-rampart-test | jq -e '.texts[0] | contains("alice@example.com") | not'
      - name: Audit locked runtime dependencies
        working-directory: enclave-go/rampart
        run: npm audit --omit=dev --audit-level=high

  maple-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy --component rustfmt
      - name: Check pilot client (no credentials or live requests)
        working-directory: enclave-go/maple-transport
        run: |
          sh prepare-sdk.sh
          cargo +1.94.1 fmt --check -p trustedrouter-maple-pilot
          cargo +1.94.1 clippy --locked --all-targets -- -D warnings
          cargo +1.94.1 test --locked --workspace --lib --bins
      - name: Check for an identical successful protected-main build
        id: maple-image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest tools.test_ci_static_maple
          python3 tools/ci_static_maple.py prepare
      - name: Build static encrypted helper for the measured image
        if: steps.maple-image.outputs.verified_run == ''
        run: python3 tools/ci_static_maple.py build
      - name: Record fresh static build for later runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.maple-image.outputs.verified_run == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.maple-image.outputs.receipt }}
          path: ${{ runner.temp }}/maple-image.sha256
          if-no-files-found: error
          retention-days: 1

  privatemode-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned client and run control-plane safety tests
        working-directory: enclave-go
        run: docker build --platform linux/amd64 --target privatemode -f Dockerfile.enclave.gcp.multi .
      - name: Build Azure-compatible pinned client
        working-directory: enclave-go
        run: docker build --platform linux/amd64 --target privatemode -f Dockerfile.enclave.azure.multi .

  enclave-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enclave-go
    strategy:
      matrix:
        # The same source tree builds distinct provider-targeted binaries via
        # two independent build-tag axes:
        #
        #   cloud_aws + llm_bedrock     → AWS Nitro Enclaves with Bedrock
        #   cloud_aws + llm_multi       → AWS production multi-provider gateway
        #   cloud_azure + llm_multi     → Azure production
        #   cloud_gcp + llm_vertex      → GCP Confidential Space with Vertex AI
        #   cloud_gcp + llm_multi       → GCP production multi-provider gateway
        #
        # The llm_openrouter backend was removed: no deployment built it. GCP,
        # AWS, and Azure production all ship llm_multi, which calls providers
        # directly, so OpenRouter sat in CI as a maintained build target that
        # nothing shipped — and misled debugging, since its auto-model ladder
        # looked like the one serving api.trustedrouter.com and was not.
        #
        # CI exercises every shipped build target so a change that breaks
        # one fails fast.
        tags:
          - "cloud_aws,llm_bedrock"
          # The combination the AWS fleet actually runs. It was missing, which
          # is how an untested tag set reached production and then had to be
          # recovered by inference — see tools/release-aws-enclave.sh.
          - "cloud_aws,llm_multi"
          # Azure is now buildable from main; keep it that way.
          - "cloud_azure,llm_multi"
          - "cloud_gcp,llm_vertex"
          - "cloud_gcp,llm_multi"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
      - uses: Lore-Hex/quill-cloud-proxy/.github/actions/setup-uv@582cbdee7b7023cfeb915b62a7f635aa1e4662b1 # main 2026-11-13
        with:
          version: "0.13.4"
      - name: Install locked sealing contract dependencies
        working-directory: .
        run: |
          uv venv "$RUNNER_TEMP/sealing-contract"
          uv export --locked --script tools/aws_sealed_bundle.py \
            --output-file "$RUNNER_TEMP/sealing-requirements.txt" >/dev/null
          uv pip install --python "$RUNNER_TEMP/sealing-contract/bin/python" \
            --require-hashes -r "$RUNNER_TEMP/sealing-requirements.txt"
          echo "QUILL_AWS_SEALER_PYTHON=$RUNNER_TEMP/sealing-contract/bin/python" >> "$GITHUB_ENV"
          echo "QUILL_AZURE_SEALER_PYTHON=$RUNNER_TEMP/sealing-contract/bin/python" >> "$GITHUB_ENV"
      - name: Build (${{ matrix.tags }})
        run: go build -tags '${{ matrix.tags }}' ./...
      - name: Vet (${{ matrix.tags }})
        run: go vet -tags '${{ matrix.tags }}' ./...
      - name: Lint (${{ matrix.tags }})
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8 run --build-tags '${{ matrix.tags }}'
      - name: Test (${{ matrix.tags }})
        # Tests under build tags run only when their tag is set, so each
        # matrix slot exercises just the code its tag combination
        # actually compiles in.
        run: go test -race -tags '${{ matrix.tags }}' ./...

      - name: Fuzz AWS sealed-bootstrap parsers
        if: matrix.tags == 'cloud_aws,llm_multi'
        env:
          GOMAXPROCS: '2'
        run: |
          # Fixed work avoids deadline-driven fuzz shutdown and keeps coverage
          # consistent between runners. A stalled run still fails the watchdog.
          go test ./internal/bootstrap/awssealed -fuzz=FuzzBundleParser -fuzztime=1000000x -parallel=2 -timeout=2m
          go test ./internal/bootstrap/awssealed -fuzz=FuzzCMSParser -fuzztime=1000000x -parallel=2 -timeout=2m

      - name: Check reachable Go vulnerabilities (${{ matrix.tags }})
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags '${{ matrix.tags }}' ./...

  attest-sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enclave-go/sidecar
    strategy:
      matrix:
        tags:
          - "cloud_aws"
          - "cloud_gcp"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
      - name: Build (${{ matrix.tags }})
        run: go build -tags '${{ matrix.tags }}' ./...
      - name: Vet (${{ matrix.tags }})
        run: go vet -tags '${{ matrix.tags }}' ./...
      - name: Test (${{ matrix.tags }})
        run: go test -race -tags '${{ matrix.tags }}' ./...
      - name: Check reachable Go vulnerabilities (${{ matrix.tags }})
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags '${{ matrix.tags }}' ./...

  parent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Lore-Hex/quill-cloud-proxy/.github/actions/setup-uv@582cbdee7b7023cfeb915b62a7f635aa1e4662b1 # main 2026-11-13
      - name: Sync
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Typecheck (mypy --strict, py3.11)
        run: uv run mypy --strict --python-version 3.11 src tests
      - name: Test
        run: uv run pytest -v

  trust-page-validation:
    # This is a required branch-protection check; policy regressions must block it.
    # Catches accidental script tags / external font fetches / etc. on
    # the static trust page before publish.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TR_REQUIRE_CRYPTO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Provenance validation resolves the exact commit that built each
          # published enclave. A shallow checkout makes older release commits
          # appear invalid even when they are ancestors of main.
          fetch-depth: 0
      - name: Validate import and signer policies with mocked AWS
        working-directory: tools/aws-secrets
        timeout-minutes: 10
        env:
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_EC2_METADATA_DISABLED: "true"
          TF_IN_AUTOMATION: "true"
        run: |
          (
            cd "$RUNNER_TEMP"
            curl --fail --silent --show-error --retry 3 --max-time 120 \
              -o terraform.zip https://releases.hashicorp.com/terraform/1.14.9/terraform_1.14.9_linux_amd64.zip
            echo '2e5cffc20a0b48a67a76268723bd5a10b8666f69b2aa4f04906e206726bedd63  terraform.zip' | sha256sum --check --strict
            mkdir terraform-bin
            unzip -q terraform.zip -d terraform-bin
          )
          export PATH="$RUNNER_TEMP/terraform-bin:$PATH"
          export TF_DATA_DIR="$RUNNER_TEMP/aws-secret-policy-data"
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color
      - uses: Lore-Hex/quill-cloud-proxy/.github/actions/setup-uv@582cbdee7b7023cfeb915b62a7f635aa1e4662b1 # main 2026-11-13
        with:
          version: "0.13.4"
      - name: Install locked attestation dependencies in isolation
        run: |
          uv venv "$RUNNER_TEMP/trust-validation"
          uv export --locked --script tools/verify-attestation.py \
            --output-file "$RUNNER_TEMP/attestation-requirements.txt" >/dev/null
          uv pip install --python "$RUNNER_TEMP/trust-validation/bin/python" \
            --require-hashes -r "$RUNNER_TEMP/attestation-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/trust-validation/bin/python" 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/trust-validation/bin" >> "$GITHUB_PATH"
          echo "PYTHONNOUSERSITE=1" >> "$GITHUB_ENV"
      - name: Test rollout hold, secondary wave and Azure ACI contracts
        id: rollout-contracts
        shell: bash
        run: |
          # These isolated harnesses use temporary state and stub cloud CLIs.
          # Overlap real wall-clock waits, not production gates or deadlines.
          failed=0
          python3 tools/test_gate_hold.py > "$RUNNER_TEMP/gate-hold.log" 2>&1 &
          hold_pid=$!
          echo "::group::Secondary wave"
          python3 tools/test_secondary_wave.py || failed=1
          echo "::endgroup::"
          echo "::group::Azure ACI"
          python3 tools/test_deploy_azure_aci.py || failed=1
          echo "::endgroup::"
          wait "$hold_pid" || failed=1
          echo "::group::Gate hold"
          cat "$RUNNER_TEMP/gate-hold.log"
          echo "::endgroup::"
          exit "$failed"
      - name: Test deploy gate helpers
        run: |
          python3 tools/test_synthetic_gate_status.py
          python3 tools/test_provider_probe_status.py
          python3 tools/test_watchdog.py
          python3 tools/test_verify_attestation.py
          python3 tools/test_check_public_tls.py
          python3 tools/test_vsock_port_map.py
          python3 tools/test_write_trust_artifacts.py
          python3 tools/test_capture_plane_measurements.py
          python3 tools/test_aws_fargate_pins.py
          python3 tools/test_check_trust_copies.py
          python3 tools/test_check_trust_signatures.py
          python3 tools/test_workflow_action_policy.py
          python3 tools/test_wait_stage_d_policy.py
          python3 tools/test_reconcile_enclave_dns.py
          python3 tools/test_nyte_acme_iam.py
          python3 tools/test_sync_route53_api_aliases.py
          python3 tools/test_dns_reconciler_scheduler.py
          python3 tools/test_rollout_safety.py
          python3 tools/test_prune_gcp_instance_templates.py
          python3 tools/test_cloud_rollout.py
          python3 tools/test_superseded_rollout.py
          python3 tools/test_gcp_enclave_inventory.py
          python3 tools/test_verify_gcp_runtime_secret_access.py
          python3 tools/test_verify_pcr0_build_args.py
          python3 tools/test_aws_iam_cmk_scope.py
          python3 tools/test_settle_outbox_alert_filter.py
          python3 -m unittest tools.test_aws_eif_manifest
          python3 -m unittest tools.test_publish_aws_eif
          python3 -m unittest tools.test_aws_eif_compute
          python3 -m unittest tools.test_aws_sealed_bundle tools.test_seal_aws_bootstrap
          python3 -m unittest tools.test_aws_bootstrap_payload
          python3 -m unittest tools.test_aws_bundle_replication
          python3 -m unittest tools.test_aws_eif_admission
          python3 -m unittest tools.test_aws_bootstrap_probe
          python3 -m unittest tools.test_verify_aws_denial_probe
          python3 -m unittest tools.test_aws_kms_admission
          python3 -m unittest tools.test_gateway_rollout
          python3 tools/test_go_toolchain_pins.py
          python3 tools/test_secret_scan_workflow.py
          python3 tools/test_nitro_root_pin.py
          python3 tools/test_mirror_independence.py
          python3 tools/test_signing_identity_matches_docs.py
          python3 tools/test_encode_ec2_user_data.py
          python3 tools/test_validate_control_plane_endpoints.py
          python3 tools/test_azure_bundle_manifest.py
          python3 tools/test_quill_secret_sources.py
          python3 tools/test_relieve_mig_stockout.py
          python3 tools/test_ensure_trustedrouter_control_host_cert.py
          python3 -m unittest discover -s tools -p 'test_maple*.py'
      - name: Verify the attestation dependency lock
        run: uv lock --check --script tools/verify-attestation.py
      - name: Assert trust page contains no <script> tags
        run: |
          if grep -qi '<script' trust-page/index.html; then
            echo "trust page must not contain <script>" >&2
            exit 1
          fi
      - name: Assert trust page declares its canonical host
        run: |
          test "$(grep -Fc '<link rel="canonical" href="https://trustedrouter.com/trust">' trust-page/index.html)" -eq 1
          test "$(grep -Fc '<link rel="canonical" href="https://trust.trustedrouter.com/">' trust-page/index.html)" -eq 0
      - name: Assert trust page contains no third-party fetches
        run: |
          # Allowlist:
          #  - github.com (source links)
          #  - aws.amazon.com / *.amazonaws.com (Nitro + KMS docs)
          #  - cloud.google.com / confidentialcomputing.googleapis.com
          #    / www.googleapis.com (Confidential Space docs + OIDC discovery)
          #  - lorehex.co + *.lorehex.co (our own pages + curl recipes;
          #    bare lorehex.co covers the marketing CTA at the top)
          #  - quillrouter.com + *.quillrouter.com (our API endpoint)
          #  - trustedrouter.com + *.trustedrouter.com (our public
          #    console/status/trust domains)
          #  - sigstore.dev / *.sigstore.dev (transparency-log docs)
          #  - raw.githubusercontent.com (this repo's own verify-attestation.py,
          #    referenced in the `uv run <raw URL>` recipe — our source, not a
          #    third party, and not a fetch the page itself makes)
          #  - token.actions.githubusercontent.com (Fulcio OIDC issuer
          #    referenced in the cosign verify recipe — required arg, not
          #    a fetch the page makes)
          grep -oE 'https?://[^"[:space:])<&]+' trust-page/index.html | sort -u > /tmp/urls.txt
          grep -vE "^https?://(github\.com|aws\.amazon\.com|docs\.aws\.amazon\.com|[a-z0-9.-]+\.amazonaws\.com|cloud\.google\.com|confidentialcomputing\.googleapis\.com|www\.googleapis\.com|lorehex\.co|[a-z0-9.-]+\.lorehex\.co|quillrouter\.com|[a-z0-9.-]+\.quillrouter\.com|trustedrouter\.com|[a-z0-9.-]+\.trustedrouter\.com|sigstore\.dev|[a-z0-9.-]+\.sigstore\.dev|token\.actions\.githubusercontent\.com|raw\.githubusercontent\.com)(:[0-9]+)?(/|$)" /tmp/urls.txt > /tmp/violations.txt || true
          if [ -s /tmp/violations.txt ]; then
            echo "trust page contains disallowed external URLs:" >&2
            cat /tmp/violations.txt >&2
            exit 1
          fi
