name: Reproduce Privatemode v1.63 for review

on:
  pull_request:
    paths:
      - '.github/workflows/reproduce-privatemode-v163.yml'
      - 'enclave-go/internal/privatemode/manifest.json'
      - 'enclave-go/third_party/privatemode/**'
  workflow_dispatch:

# Public-source evidence only. This workflow cannot publish pins or deploy.
permissions:
  contents: read

concurrency:
  group: privatemode-v163-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [policies, images]
    env:
      SOURCE_COMMIT: 2634ffb82c72339902f26ae071db513add2bdc2f
      SOURCE_SHA256: d76de0050c7e3d16a0938bdc4d2f87f4008ed67fd2e2312b587f0d340540da5d
      MANIFEST_SHA256: 5fa927e3b864738da35d427c10ba8e49ebeeb1531e49618899cf95f654d240c1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Acquire immutable public source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pm-source" "$RUNNER_TEMP/pm-evidence"
          curl --location --fail --silent --show-error --max-time 300 \
            "https://codeload.github.com/edgelesssys/privatemode-public/tar.gz/$SOURCE_COMMIT" \
            -o "$RUNNER_TEMP/pm-source.tar.gz"
          printf '%s  %s\n' "$SOURCE_SHA256" "$RUNNER_TEMP/pm-source.tar.gz" | sha256sum -c -
          printf '%s  %s\n' "$MANIFEST_SHA256" enclave-go/internal/privatemode/manifest.json | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pm-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/pm-source"
          cp enclave-go/internal/privatemode/manifest.json "$RUNNER_TEMP/pm-evidence/expected-manifest.json"
          printf '%s\n' "$SOURCE_COMMIT" > "$RUNNER_TEMP/pm-evidence/source-commit.txt"
      - name: Reproduce policies and hardware references
        if: matrix.kind == 'policies'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pm-tools"
          curl --location --fail --silent --show-error --max-time 300 \
            https://github.com/edgelesssys/contrast/releases/download/v1.26.1/contrast-x86_64-linux \
            -o "$RUNNER_TEMP/pm-tools/contrast"
          printf '%s  %s\n' a13a8264c7557e9943df5566e60c3d14fc4f37d4bfef301f32a1def5461372d8 \
            "$RUNNER_TEMP/pm-tools/contrast" | sha256sum -c -
          curl --location --fail --silent --show-error --max-time 120 \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 \
            -o "$RUNNER_TEMP/pm-tools/yq"
          printf '%s  %s\n' c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385 \
            "$RUNNER_TEMP/pm-tools/yq" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/pm-tools/contrast" "$RUNNER_TEMP/pm-tools/yq"
          export PATH="$RUNNER_TEMP/pm-tools:$PATH"
          cd "$RUNNER_TEMP/pm-source"
          contrast generate --disable-updates --reference-values=metal-qemu-snp-gpu \
            --reference-value-patches=scripts/snp-guestpolicy-patch.json \
            --collateral-proxy=http://collateral-proxy.continuum-infra.svc deployment.yaml
          cp manifest.json "$RUNNER_TEMP/pm-evidence/raw-manifest.json"
          export SECRET_SERVICE_K8S_INTERNAL_DOMAIN=secret-service-internal.continuum-a225c8.svc.cluster.local
          export SECRET_SERVICE_K8S_HEADLESS_DOMAIN='*.secret-service-headless.continuum-a225c8.svc.cluster.local'
          bash scripts/adjust-manifest.sh manifest.json
          yq -i 'del(.ReferenceValues.snp[] | select(.ProductName == "Milan"))' manifest.json
          cp manifest.json "$RUNNER_TEMP/pm-evidence/reproduced-manifest.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pm-evidence'
          actual = json.loads((root / 'reproduced-manifest.json').read_text())
          expected = json.loads((root / 'expected-manifest.json').read_text())
          assert len(actual['Policies']) == len(expected['Policies']) == 8
          recovery = expected['SeedshareOwnerPubKeys']
          assert len(recovery) == 1
          fingerprint = hashlib.sha256(recovery[0].encode()).hexdigest()
          assert fingerprint == '178755e374568f2508b7b89c614dfec96054bad3734f28314dab345fe1672fc9'
          # Recovery ownership is explicitly operator-approved, never source-reproduced.
          actual.pop('SeedshareOwnerPubKeys', None)
          expected.pop('SeedshareOwnerPubKeys', None)
          assert actual == expected, 'Independent policy or hardware-reference mismatch'
          evidence = {'matched_except_recovery_identity': True, 'policies': 8,
                      'recovery_key_sha256': fingerprint, 'recovery_owner_approved': False}
          (root / 'policy-comparison.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence))
          PY
      - name: Rebuild all five security-component images without vendor caches
        if: matrix.kind == 'images'
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pm-images"
          docker run --rm --cpus 4 --memory 10g --pids-limit 512 \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$RUNNER_TEMP/pm-source,target=/src,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/pm-images,target=/out" \
            --entrypoint /bin/sh \
            nixos/nix@sha256:c7cc6c8cb5d81bed19997247629604708fda95c99c43ac362daa05b6a68e8a24 \
            -ec '
              nix --version
              nix --extra-experimental-features "nix-command flakes" build \
                --option accept-flake-config false \
                --option substituters https://cache.nixos.org --option extra-substituters "" \
                --option sandbox false --option build-users-group "" --option builders "" \
                --option connect-timeout 15 --option stalled-download-timeout 60 \
                --option download-attempts 2 --max-jobs 2 --cores 2 \
                --out-link /tmp/result --impure --expr '\''
                  let p = (builtins.getFlake "path:/src").legacyPackages.x86_64-linux;
                  in p.linkFarmFromDrvs "privatemode-security-images"
                    (map p.toOciImage [p.attestation-agent.image p.disk-mounter.image
                      p.inference-proxy.image p.kernel-log.image p.secret-service.image])'\''
              cp -RL /tmp/result/. /out/
            '
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = {
              'attestation-agent': 'f1b67d1d22246ffcf76c5b4379a4ff2a6b340f679e64c030bf84981f296d8da8',
              'disk-mounter': 'f66f2ea5feb4a39ec4f8ec1e464e7d911ee2f67ef468603cb80fbcbf341ec931',
              'inference-proxy': 'f7c2b213a0bb34b1289bf2c3a18bcc44f241ae622c961c36bc44d13820d63f92',
              'kernel-log': '55561e652ff9672f7a9304592a0ea3a9478ef0acc6a33243cc5697e76b95256a',
              'secret-service': '26c797bbde03151b1ae29fec1618dc74b67ba5a7b08f0bc1f20a9d90df06ec7b',
          }
          root = Path(os.environ['RUNNER_TEMP'])
          found = {}
          for index in (root / 'pm-images').glob('*/index.json'):
              name = index.parent.name
              assert name in expected and name not in found, name
              descriptors = json.loads(index.read_text())['manifests']
              assert len(descriptors) == 1
              digest = descriptors[0]['digest']
              assert digest == 'sha256:' + expected[name], (name, digest)
              blob = index.parent / 'blobs/sha256' / expected[name]
              assert hashlib.sha256(blob.read_bytes()).hexdigest() == expected[name]
              found[name] = digest
          assert set(found) == set(expected), found
          (root / 'pm-evidence/image-comparison.json').write_text(json.dumps(found, indent=2) + '\n')
          print(json.dumps(found, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privatemode-v163-${{ matrix.kind }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pm-evidence/
          if-no-files-found: error
          retention-days: 1
