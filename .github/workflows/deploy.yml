name: Deploy AWS legacy

on:
  # Legacy AWS path retained for explicit operator use only. Production prompt
  # traffic is GCP Confidential Space; automatic push deploys must not try to
  # assume AWS roles or publish stale trust artifacts. It builds images only:
  # publish-trust-s3.yml publishes the trust mirror.
  workflow_dispatch: {}

permissions:
  id-token: write   # for OIDC into AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: Lore-Hex/quill-cloud-proxy/.github/actions/aws-credentials@PINSHA # main 2026-11-13
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: Lore-Hex/quill-cloud-proxy/.github/actions/ecr-login@PINSHA # main 2026-11-13

      - name: Set up QEMU (for arm64 emulation)
        uses: Lore-Hex/quill-cloud-proxy/.github/actions/setup-qemu@PINSHA # main 2026-11-13
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: Lore-Hex/quill-cloud-proxy/.github/actions/setup-buildx@PINSHA # main 2026-11-13

      # The Go enclave is the prompt-handling boundary. Built statically
      # from scratch base for a small, auditable EIF.
      #
      # Three image tags pushed per deploy, one per LLM-provider target:
      #   enclave-aws-latest         → Bedrock        (default trust tier)
      #   enclave-openrouter-latest  → OpenRouter ZDR (contractual ZDR)
      #   enclave-gcp-latest         → Vertex AI      (different runtime)
      # `enclave-latest` is aliased to whichever target the production
      # deploy is currently running, so flipping providers is a single
      # `docker tag … enclave-latest` away. Keeping the AWS image as the
      # default `enclave-latest` for backward compat with existing infra.
      - name: Build + push Go enclave image (AWS / arm64)
        env:
          ECR: ${{ steps.login-ecr.outputs.registry }}/quill-cloud-proxy
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file enclave-go/Dockerfile.enclave \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --tag "$ECR:enclave-aws-latest" \
            --tag "$ECR:enclave-latest" \
            --push \
            enclave-go

      - name: Build + push Go enclave image (OpenRouter / arm64)
        env:
          ECR: ${{ steps.login-ecr.outputs.registry }}/quill-cloud-proxy
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file enclave-go/Dockerfile.enclave.openrouter \
            --tag "$ECR:enclave-openrouter-latest" \
            --push \
            enclave-go

      - name: Build + push parent image (arm64)
        env:
          ECR: ${{ steps.login-ecr.outputs.registry }}/quill-cloud-proxy
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file parent/Dockerfile.parent \
            --tag "$ECR:parent-latest" \
            --push \
            parent
