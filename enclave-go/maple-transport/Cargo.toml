[package]
name = "trustedrouter-maple-pilot"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "trustedrouter-maple-pilot"

[dependencies]
bytes = "1.8"
eventsource-stream = "0.2"
futures = "0.3"
http = "1.1"
maple-sdk = { path = ".vendor-sdk", version = "=4.1.3" }
serde_json = "1.0"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1.8"

[workspace]
members = [".vendor-sdk"]
default-members = ["."]
