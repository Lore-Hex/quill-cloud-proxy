[package]
name = "polyphemus-classifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Classifies a prompt locally for Polyphemus model selection. It has no
# network code: the gateway writes text to stdin and reads one JSON line back.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
candle-transformers = { version = "0.11.1", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
